# deploy-staging.yml（T-0018，OPS-03，06_部署架構與CICD.md §3.2）
#
# main 綠燈（ci.yml 全綠）後自動部署 staging（GCP Cloud Run）。
# 階段順序固定：auth → migrate → build & push → deploy → verify
# （06 §3.2；migrate 先於 build&push／deploy 是 expand-contract 的
# expand 階段，任一階段失敗即中止，前一版服務維持可用）。
#
# 認證：Workload Identity Federation（06 §3.2.1）。**倉庫中不存在任何
# 長期金鑰**——GCP_WIF_PROVIDER／GCP_SERVICE_ACCOUNT 兩個 repository
# secrets 只是 WIF 資源名稱與服務帳號 email，本身不是可用於登入的憑證值。
#
# 本 repo 目前無遠端，本工作流語法已通過 actionlint／YAML 解析檢查，
# 實際執行待使用者提供 GitHub repo 與下列 GitHub secrets／variables
# 後才會觸發（見 README「部署與 secrets」章節）。

name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # WIF 用：向 GCP 換取短期憑證

jobs:
  deploy:
    name: deploy-staging
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
      GCP_RUN_SERVICE: ${{ vars.GCP_RUN_SERVICE }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run build
        # migrate 腳本讀 dist/db/migrate.js（Leader 裁決 T-0013-②），
        # 必須先 build。
        run: npm run build

      # ---- auth（WIF，06 §3.2.1） ----
      - name: auth（Workload Identity Federation）
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: setup-gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: gcloud auth configure-docker
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      # ---- migrate（先於 build & push／deploy，expand-contract 的 expand 階段） ----
      - name: migrate（NEON_DATABASE_URL，forward-only）
        env:
          NODE_ENV: production
          PORT: "8080"
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          LOG_LEVEL: info
        run: npm run migrate

      # ---- build & push（Artifact Registry，SHA 標籤為事實來源） ----
      - name: docker build & push
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPOSITORY }}/todo-app
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      # ---- deploy（gcloud run deploy，部署一律用 SHA 標籤，不得用 latest） ----
      - name: gcloud run deploy
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPOSITORY }}/todo-app
        run: |
          set -euo pipefail
          gcloud run deploy "${GCP_RUN_SERVICE}" \
            --image "${IMAGE}:${{ github.sha }}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 80 \
            --timeout 60s \
            --set-env-vars "NODE_ENV=production,LOG_LEVEL=info,CORS_ALLOWED_ORIGINS=" \
            --set-secrets "DATABASE_URL=database-url:latest,BASIC_AUTH_USER=basic-auth-user:latest,BASIC_AUTH_PASSWORD=basic-auth-pass:latest"

      # ---- verify（輪詢 /health 至 200，上限 5 分鐘，06 §3.2 verify 階段） ----
      - name: verify（取服務網址）
        id: service_url
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${GCP_RUN_SERVICE}" --region "${GCP_REGION}" --format="value(status.url)")"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          if [ -n "${STAGING_BASE_URL}" ] && [ "${STAGING_BASE_URL}" != "${URL}" ]; then
            echo "::warning::STAGING_BASE_URL（${STAGING_BASE_URL}）與 Cloud Run 實際網址（${URL}）不一致，請回填 GitHub repository variable STAGING_BASE_URL"
          fi

      - name: verify（輪詢 /health 至 200）
        env:
          BASE_URL: ${{ steps.service_url.outputs.url }}
          POLL_INTERVAL_SECONDS: "10"
          POLL_TIMEOUT_SECONDS: "300"
        run: npm run verify:health

      - name: verify（帶憑證呼叫 /api/v1/todos 確認 200）
        env:
          BASE_URL: ${{ steps.service_url.outputs.url }}
          BASIC_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_PASS: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          CODE="$(curl -fsS -o /dev/null -w "%{http_code}" \
            -u "$BASIC_USER:$BASIC_PASS" \
            "${BASE_URL}/api/v1/todos")"
          echo "GET /api/v1/todos -> ${CODE}"
          test "${CODE}" = "200"

      - name: 回填提示（首次部署後的網址）
        if: always() && steps.service_url.outputs.url != ''
        run: |
          {
            echo "### staging 網址"
            echo ""
            echo "Cloud Run 服務網址：\`${{ steps.service_url.outputs.url }}\`"
            echo ""
            echo "首次部署後請 dev-ops 回填三處（06 §1）：本檔對應的"
            echo "GitHub repository variable \`STAGING_BASE_URL\`、"
            echo "\`docs/specs/06_部署架構與CICD.md\` 第 1 章環境清單、"
            echo "\`docs/specs/04_API規格.yaml\` 的 \`servers\` 區塊 staging 項。"
          } >> "$GITHUB_STEP_SUMMARY"
