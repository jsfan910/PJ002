# deploy-staging.yml（T-0018，OPS-03，06_部署架構與CICD.md §3.2；
# secret 釘版本／verify 自動重試為 T-0039，06 §6.7 建議一、建議二）
#
# main 綠燈（ci.yml 全綠）後自動部署 staging（GCP Cloud Run）。
# 階段順序固定：auth → migrate → build & push → deploy → verify
# （06 §3.2；migrate 先於 build&push／deploy 是 expand-contract 的
# expand 階段，任一階段失敗即中止，前一版服務維持可用）。
#
# 認證：Workload Identity Federation（06 §3.2.1）。**倉庫中不存在任何
# 長期金鑰**——GCP_WIF_PROVIDER／GCP_SERVICE_ACCOUNT 兩個 repository
# secrets 只是 WIF 資源名稱與服務帳號 email，本身不是可用於登入的憑證值。
#
# T-0039：Secret Manager 參照改釘具體版本（不再用 :latest），版本號
# 取自「該 secret 目前狀態為 ENABLED 的最新版本」，寫入 STEP SUMMARY
# 供稽核；可用 repository variables SECRET_VERSION_DATABASE_URL／
# SECRET_VERSION_BASIC_AUTH_USER／SECRET_VERSION_BASIC_AUTH_PASS 覆寫
# 釘定版本（見 README「部署與 secrets」）。verify（帶憑證）失敗時，
# 自動以相同參數重新 `gcloud run deploy` 一次並再驗證一次，仍失敗才
# 判紅（06 §6.7 建議二）。
#
# 本 repo 目前無遠端，本工作流語法已通過 actionlint／YAML 解析檢查，
# 實際執行待使用者提供 GitHub repo 與下列 GitHub secrets／variables
# 後才會觸發（見 README「部署與 secrets」章節）。

name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # WIF 用：向 GCP 換取短期憑證

jobs:
  deploy:
    name: deploy-staging
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
      GCP_RUN_SERVICE: ${{ vars.GCP_RUN_SERVICE }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run build
        # migrate 腳本讀 dist/db/migrate.js（Leader 裁決 T-0013-②），
        # 必須先 build。
        run: npm run build

      # ---- auth（WIF，06 §3.2.1） ----
      - name: auth（Workload Identity Federation）
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: setup-gcloud
        uses: google-github-actions/setup-gcloud@v2

      # ---- 釘 Secret Manager 版本（T-0039，06 §6.7 建議一） ----
      - name: resolve secret versions（釘具體版本，不用 :latest）
        id: secret_versions
        env:
          OVERRIDE_DATABASE_URL: ${{ vars.SECRET_VERSION_DATABASE_URL }}
          OVERRIDE_BASIC_AUTH_USER: ${{ vars.SECRET_VERSION_BASIC_AUTH_USER }}
          OVERRIDE_BASIC_AUTH_PASS: ${{ vars.SECRET_VERSION_BASIC_AUTH_PASS }}
        run: |
          set -euo pipefail

          # T-0039 r2：resolve_version() 內的 `gcloud secrets versions list`
          # 若非 0 結束，絕不能讓外層 `set -e` 直接把整個 job 中止在
          # 「Process completed with exit code 1.」且不留下任何可讀訊息
          # （r1 真實 run 35506278351 的根因：命令替代賦值 V_DB="$(resolve_version …)"
          # 被 set -e 觸發，程式碼還沒走到下面的空值檢查就已經結束，
          # 使用者只看得到 exit code、看不到「為什麼」）。改為在函式內部
          # 先把 stdout+stderr 一起收進變數再判斷，失敗時當場輸出
          # ::error:: annotation（含 gcloud 原始錯誤訊息與修復指引）再
          # return 1；呼叫端用 `|| exit 1` 承接，避免同一個問題重演。
          resolve_version() {
            local secret_name="$1"
            local override="$2"
            if [ -n "${override}" ]; then
              echo "${override}"
              return 0
            fi
            local out
            if ! out="$(gcloud secrets versions list "${secret_name}" \
              --filter="state=ENABLED" \
              --sort-by="~createTime" \
              --limit=1 \
              --format="value(name)" 2>&1)"; then
              echo "::error::無法列出 secret ${secret_name} 的版本（gcloud 原始訊息：${out}）。最常見原因：部署服務帳號缺少 secretmanager.versions.list 權限（需 roles/secretmanager.viewer，見 README「部署與 secrets」一節；既有專案要補跑一次 IAM 授權才會生效）；也可能是 secret 尚未建立。若暫時無法調整 IAM，可改用對應的 repository variable SECRET_VERSION_DATABASE_URL／SECRET_VERSION_BASIC_AUTH_USER／SECRET_VERSION_BASIC_AUTH_PASS 直接指定版本號略過此查詢" >&2
              return 1
            fi
            if [ -z "${out}" ]; then
              echo "::error::secret ${secret_name} 沒有任何 state=ENABLED 的版本，請先在 Secret Manager 建立至少一個版本" >&2
              return 1
            fi
            echo "${out}"
          }

          V_DB="$(resolve_version database-url "${OVERRIDE_DATABASE_URL:-}")" || exit 1
          V_USER="$(resolve_version basic-auth-user "${OVERRIDE_BASIC_AUTH_USER:-}")" || exit 1
          V_PASS="$(resolve_version basic-auth-pass "${OVERRIDE_BASIC_AUTH_PASS:-}")" || exit 1

          echo "database_url_version=${V_DB}" >> "$GITHUB_OUTPUT"
          echo "basic_auth_user_version=${V_USER}" >> "$GITHUB_OUTPUT"
          echo "basic_auth_pass_version=${V_PASS}" >> "$GITHUB_OUTPUT"

          {
            echo "### 本次部署釘定的 Secret Manager 版本（06 §6.7 建議一）"
            echo ""
            echo "| secret | 版本 |"
            echo "|---|---|"
            echo "| database-url | ${V_DB} |"
            echo "| basic-auth-user | ${V_USER} |"
            echo "| basic-auth-pass | ${V_PASS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: gcloud auth configure-docker
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      # ---- migrate（先於 build & push／deploy，expand-contract 的 expand 階段） ----
      - name: migrate（NEON_DATABASE_URL，forward-only）
        env:
          NODE_ENV: production
          PORT: "8080"
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          LOG_LEVEL: info
        run: npm run migrate

      # ---- build & push（Artifact Registry，SHA 標籤為事實來源） ----
      - name: docker build & push
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPOSITORY }}/todo-app
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      # ---- deploy（gcloud run deploy，部署一律用 SHA 標籤，不得用 latest）
      #      ＋ verify（輪詢 /health、帶憑證呼叫 /api/v1/todos）。
      #      verify（帶憑證）失敗時自動以相同參數重新部署一次再驗證一次，
      #      仍失敗才判紅（06 §6.7 建議二，重試上限 1 次）。 ----
      - name: gcloud run deploy ＋ verify（含一次自動重試）
        id: deploy_verify
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPOSITORY }}/todo-app
          BASIC_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_PASS: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          DB_VERSION: ${{ steps.secret_versions.outputs.database_url_version }}
          USER_VERSION: ${{ steps.secret_versions.outputs.basic_auth_user_version }}
          PASS_VERSION: ${{ steps.secret_versions.outputs.basic_auth_pass_version }}
        run: |
          set -euo pipefail

          deploy_revision() {
            gcloud run deploy "${GCP_RUN_SERVICE}" \
              --image "${IMAGE}:${{ github.sha }}" \
              --region "${GCP_REGION}" \
              --platform managed \
              --allow-unauthenticated \
              --port 8080 \
              --memory 512Mi \
              --cpu 1 \
              --min-instances 0 \
              --max-instances 2 \
              --concurrency 80 \
              --timeout 60s \
              --set-env-vars "NODE_ENV=production,LOG_LEVEL=info,CORS_ALLOWED_ORIGINS=" \
              --set-secrets "DATABASE_URL=database-url:${DB_VERSION},BASIC_AUTH_USER=basic-auth-user:${USER_VERSION},BASIC_AUTH_PASSWORD=basic-auth-pass:${PASS_VERSION}"
          }

          get_service_url() {
            gcloud run services describe "${GCP_RUN_SERVICE}" --region "${GCP_REGION}" --format="value(status.url)"
          }

          get_latest_created_revision() {
            gcloud run services describe "${GCP_RUN_SERVICE}" --region "${GCP_REGION}" --format="value(status.latestCreatedRevisionName)"
          }

          get_latest_ready_revision() {
            gcloud run services describe "${GCP_RUN_SERVICE}" --region "${GCP_REGION}" --format="value(status.latestReadyRevisionName)"
          }

          get_traffic_table() {
            gcloud run services describe "${GCP_RUN_SERVICE}" --region "${GCP_REGION}" --format="table[no-heading](status.traffic.revisionName,status.traffic.percent)"
          }

          # ---- T-0045 事故修法：驗證新 revision 是否真的接到流量 ----
          # 事故根因：09-19 回滾演練以 `update-traffic --to-revisions <rev>=100`
          # 把 spec.traffic 從「一律跟隨最新 revision（latestRevision: true）」
          # 改成「明確釘死在某個具名 revision」；演練後未還原，之後 15 次
          # `gcloud run deploy` 都成功建立新 revision 並通過 startup probe，
          # 但流量從未被切過去——因為 spec.traffic 已不再追蹤 latest，
          # `gcloud run deploy` 預設不會覆寫這個明確釘定的流量設定。
          # verify_health／verify_auth 只打 service URL（同一個網址不論流量
          # 指到哪個 revision 都會回應），因此每次都「全綠」卻驗不出流量沒切過去。
          # 判準：`status.latestReadyRevisionName` 在 Cloud Run 的實作中會跟隨
          # 目前實際接流量的 revision（非單純「最近一次 Ready 的 revision」，
          # 已於本次事故復原時以 `services describe` 實測確認：流量釘死時
          # latestReadyRevisionName 停在舊 revision、latestCreatedRevisionName
          # 已前進到新 revision；`update-traffic --to-latest` 後兩者立即相等）。
          verify_traffic() {
            local expected_revision="$1"
            local latest_ready
            latest_ready="$(get_latest_ready_revision)"
            echo "latestReadyRevisionName=${latest_ready}（預期／新部署的 revision=${expected_revision}）"
            [ "${latest_ready}" = "${expected_revision}" ]
          }

          ensure_traffic_on_latest() {
            local expected_revision="$1"
            if verify_traffic "${expected_revision}"; then
              echo "流量已在新 revision（${expected_revision}），無需修正"
              return 0
            fi
            echo "::warning::新 revision（${expected_revision}）未拿到流量，目前流量分佈：$(get_traffic_table | tr '\n' ';')。依 T-0045 事故修法自動執行 update-traffic --to-latest 並重新驗證"
            gcloud run services update-traffic "${GCP_RUN_SERVICE}" --region "${GCP_REGION}" --to-latest
            if ! verify_traffic "${expected_revision}"; then
              echo "::error::update-traffic --to-latest 後新 revision（${expected_revision}）仍未拿到 100% 流量，目前流量分佈：$(get_traffic_table | tr '\n' ';')。判定部署失敗，需人工介入（06 §5.1／§6.10）"
              return 1
            fi
            echo "update-traffic --to-latest 已生效，流量已在新 revision（${expected_revision}）"
          }

          verify_health() {
            BASE_URL="$1" POLL_INTERVAL_SECONDS=10 POLL_TIMEOUT_SECONDS=300 npm run verify:health
          }

          verify_auth() {
            local base_url="$1"
            local code
            code="$(curl -fsS -o /dev/null -w "%{http_code}" -u "${BASIC_USER}:${BASIC_PASS}" "${base_url}/api/v1/todos")" || return 1
            echo "GET /api/v1/todos -> ${code}"
            [ "${code}" = "200" ]
          }

          echo "== deploy（第 1 次） =="
          deploy_revision
          URL="$(get_service_url)"
          NEW_REVISION="$(get_latest_created_revision)"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          if [ -n "${STAGING_BASE_URL}" ] && [ "${STAGING_BASE_URL}" != "${URL}" ]; then
            echo "::warning::STAGING_BASE_URL（${STAGING_BASE_URL}）與 Cloud Run 實際網址（${URL}）不一致，請回填 GitHub repository variable STAGING_BASE_URL"
          fi

          verify_health "${URL}"

          if ! ensure_traffic_on_latest "${NEW_REVISION}"; then
            {
              echo "### 部署流量檢查（T-0045）"
              echo ""
              echo "| revision | 流量 |"
              echo "|---|---|"
              echo "| ${NEW_REVISION}（本次部署） | 未拿到 100%，見上方 ::error:: |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### 部署流量檢查（T-0045）"
            echo ""
            echo "| revision | 流量 |"
            echo "|---|---|"
            echo "| ${NEW_REVISION}（本次部署） | 100% |"
          } >> "$GITHUB_STEP_SUMMARY"

          RETRIED=false
          if verify_auth "${URL}"; then
            echo "verify（帶憑證）第 1 次即通過"
          else
            RETRIED=true
            echo "::warning::verify（帶憑證）第 1 次失敗，依 06 §6.7 建議二自動重試一次（相同參數重新部署）"
            echo "== deploy（第 2 次，自動重試，上限 1 次） =="
            deploy_revision
            URL="$(get_service_url)"
            NEW_REVISION="$(get_latest_created_revision)"
            echo "url=${URL}" >> "$GITHUB_OUTPUT"
            verify_health "${URL}"
            if ! ensure_traffic_on_latest "${NEW_REVISION}"; then
              echo "retried=true" >> "$GITHUB_OUTPUT"
              echo "retry_result=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if ! verify_auth "${URL}"; then
              echo "::error::verify（帶憑證）重試 1 次後仍失敗，判定部署失敗"
              echo "retried=true" >> "$GITHUB_OUTPUT"
              echo "retry_result=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "verify（帶憑證）重試後通過"
            echo "retry_result=passed" >> "$GITHUB_OUTPUT"
          fi
          echo "retried=${RETRIED}" >> "$GITHUB_OUTPUT"

      - name: 回填提示（首次部署後的網址）
        if: always() && steps.deploy_verify.outputs.url != ''
        run: |
          {
            echo "### staging 網址"
            echo ""
            echo "Cloud Run 服務網址：\`${{ steps.deploy_verify.outputs.url }}\`"
            echo ""
            echo "首次部署後請 dev-ops 回填三處（06 §1）：本檔對應的"
            echo "GitHub repository variable \`STAGING_BASE_URL\`、"
            echo "\`docs/specs/06_部署架構與CICD.md\` 第 1 章環境清單、"
            echo "\`docs/specs/04_API規格.yaml\` 的 \`servers\` 區塊 staging 項。"
            if [ "${{ steps.deploy_verify.outputs.retried }}" = "true" ]; then
              echo ""
              if [ "${{ steps.deploy_verify.outputs.retry_result }}" = "passed" ]; then
                echo "**已重試**：verify（帶憑證呼叫 /api/v1/todos）第 1 次失敗，"
                echo "已依 06 §6.7 建議二自動重新部署並再驗證一次後通過。"
              else
                echo "**已重試**：verify（帶憑證呼叫 /api/v1/todos）第 1 次失敗，"
                echo "已依 06 §6.7 建議二自動重試一次，重試後仍失敗，本次部署判定失敗。"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
